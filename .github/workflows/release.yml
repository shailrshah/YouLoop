name: Release

on:
  push:
    tags: ['v*']

# Needed to create a GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Guard: refuse to publish if package.json version doesn't match the tag.
      # The tag `v1.0.0` must map to package.json version `1.0.0`.
      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p 'require(`./package.json`).version')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (v$TAG_VERSION) does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Run tests so a broken release never ships.
      - run: npm test

      # Build both browsers.
      - run: npm run build
      - run: npm run build:firefox

      # Package for each browser. wxt zip emits into .output/.
      - run: npm run zip
      - name: Zip Firefox build
        run: npx wxt zip -b firefox

      # Discover the produced zip paths — WXT names them
      # `<name>-<version>-<browser>.zip`.
      - name: Locate release artifacts
        id: artifacts
        run: |
          CHROME_ZIP=$(ls .output/*chrome*.zip | head -n1)
          FIREFOX_ZIP=$(ls .output/*firefox*.zip | head -n1)
          echo "chrome=$CHROME_ZIP" >> "$GITHUB_OUTPUT"
          echo "firefox=$FIREFOX_ZIP" >> "$GITHUB_OUTPUT"

      # Create the GitHub Release with auto-generated notes from commits
      # since the previous tag, and attach both zips.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.chrome }}
            ${{ steps.artifacts.outputs.firefox }}
